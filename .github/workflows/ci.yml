name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # The idle-zero browser gate: mounted quiescent Surfaces cost
  # 0 paints/s. drawElementImage is an origin-trial API; where the
  # runner's Chrome lacks it the gate warns and exits 0 — a loud
  # annotation, not a red build, for an environmental gap. Everywhere
  # capability exists, a nonzero idle delta is a real failure.
  idle-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:idle-zero
        env:
          CHROME_PATH: /usr/bin/google-chrome
