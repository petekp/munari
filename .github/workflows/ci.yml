name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # A published canvas frame is not handed off until the public Surface has
  # uploaded and drawn those exact sRGB pixels. This uses ordinary WebGL and
  # does not depend on the HTML-in-canvas origin trial.
  frame-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:frame-surface

  # The idle-zero browser gate: mounted quiescent Surfaces cost
  # 0 paints/s. drawElementImage is an origin-trial API; where the
  # runner's Chrome lacks it the gate warns and exits 0 — a loud
  # annotation, not a red build, for an environmental gap. Everywhere
  # capability exists, a nonzero idle delta is a real failure.
  idle-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:idle-zero

  genie-film-reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:genie-film-reorder

  dom-surface-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:dom-surface-demand

  # The shader-compile browser gate: a shader is a string until a
  # browser makes a program of it, so nothing else in CI can tell a
  # working one from a broken one. Cheapest gate here, and the one the
  # rest assume — a shader that never compiles surfaces in the others
  # as a timeout, if it surfaces at all.
  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:shaders

# ── gates that run by hand, not here ────────────────────────────────────
#
# `gate:knobs-input`, `gate:knobs-viewport` and `gate:knobs-resize` cover
# real kernel behavior — the shared canvas pointer gate under touch and
# pen, paint/anchor/generation agreement across both container-query
# boundaries, focus reachability and 1:1 world scale. They are not here
# because a GitHub runner has no GPU, and these three wait on hundreds of
# animation frames. Measured 2026-08-15 on ubuntu-latest: knobs-input
# spent 35–49s per route pass against ~1.5s on GPU Chrome, and
# knobs-viewport spent 101s inside a viewport body that costs 0.8s here.
# All three together would need roughly ten minutes of runner time per
# push. On a real GPU they finish in 7–10s each, so they are a check to
# run before a release, not on every commit.
#
# `gate:crossing` is out for a different reason: it does not currently
# tell the truth. The handoff it exists to police is clean — static swaps
# agree to 0.19 css px — while the carry check fails on a measurement
# artifact plus a budget that was already marginal. What it measures, and
# the three ranked fixes, are in docs/spikes/crossing-carry.md. It comes
# back when the first of those lands.
