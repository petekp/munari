name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # A published canvas frame is not handed off until the public Surface has
  # uploaded and drawn those exact sRGB pixels. This uses ordinary WebGL and
  # does not depend on the HTML-in-canvas origin trial.
  frame-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:frame-surface

  # The idle-zero browser gate: mounted quiescent Surfaces cost
  # 0 paints/s. drawElementImage is an origin-trial API; where the
  # runner's Chrome lacks it the gate warns and exits 0 — a loud
  # annotation, not a red build, for an environmental gap. Everywhere
  # capability exists, a nonzero idle delta is a real failure.
  idle-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:idle-zero

  # The knobs-resize browser gate: while a hand drags the panel, the box
  # its face is rasterized at equals the box its face actually occupies.
  # Same capability policy as idle-zero — a Chrome without
  # drawElementImage warns and exits 0.
  knobs-resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:knobs-resize

