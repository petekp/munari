name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
# The idle-zero browser gate (archive#3: mounted quiescent Surfaces =
# 0 paints/s) joins this workflow when the paint layer lands — it must
# land WITH that layer, not after (CLAUDE.md).
