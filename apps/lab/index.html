<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The shell and its frame share this wash before scripts or fonts arrive.
         App selects other scenes' backgrounds before their first React paint. -->
    <style>
      :root { --document-background: #e3ec5a; background: var(--document-background); }
      #site-opening { display: none; position: fixed; inset: 0; z-index: 2147483647; place-items: center; align-content: center; gap: 22px; padding: 24px; background: #e3ec5a; color: #14140f; text-align: center; transition: opacity 120ms ease-out; }
      #site-opening svg { width: min(200px, 50vw); height: auto; fill: currentColor; }
      #site-opening p { margin: 0; font: 12px/1.5 system-ui, sans-serif; }
      #site-opening a { color: inherit; text-underline-offset: 3px; }
      #site-opening .site-opening-recovery { display: none; }
      html[data-opening] #site-opening { display: grid; }
      html[data-opening='slow'] #site-opening .site-opening-recovery { display: block; }
      html[data-opening='revealing'] #site-opening { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) { #site-opening { transition: none; } }
    </style>
    <script>
      {
        const params = new URLSearchParams(location.search)
        if (!params.has('framed') && !params.has('bare')) {
          document.documentElement.dataset.opening = 'preparing'
          setTimeout(() => {
            if (document.documentElement.dataset.opening === 'preparing') document.documentElement.dataset.opening = 'slow'
          }, 10000)
        }
      }
    </script>
    <title>Munari · Live HTML in 3D</title>
    <meta name="description" content="Explore live HTML in a Three.js scene. Munari is an experimental React library for physical interfaces, materials, and motion." />
    <!-- The demo's own permission. An origin-trial token is a signed claim —
         "this origin may use HTMLInCanvas until this date" — that Chrome
         verifies against a public key it ships with, so a visitor needs no
         flag and installs nothing. The claim is bound to
         https://munari.vercel.app:443. Its signed payload is the one expiry
         source; `npm run check:origin-trial` reads it before the renewal
         window. Localhost is a different origin, so development still needs
         chrome://flags/#canvas-draw-element — the tag is inert there, not
         permissive. -->
    <meta
      http-equiv="origin-trial"
      content="AuNAQ7es2QAvKBMeNd2IBnkxhUnp2zo/W9qfBRZMhKsUKQT4plJxWErGWEk0yKjlo+kmTs4AZDZlV12dRtA59QkAAABXeyJvcmlnaW4iOiJodHRwczovL211bmFyaS52ZXJjZWwuYXBwOjQ0MyIsImZlYXR1cmUiOiJIVE1MSW5DYW52YXMiLCJleHBpcnkiOjE3OTI0NTQ0MDB9"
    />
    <!-- Fetch the first screen's faces with the document, before React mounts
         either viewport. They are the same fonts used by captured HTML; block
         avoids baking a temporary fallback face into its first texture. -->
    <link rel="preload" href="/fonts/archivo-400-900-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/bodoni-moda-400-900-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-400-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/archivo-narrow-500-700-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display-900-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
