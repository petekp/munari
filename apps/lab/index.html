    <!-- The bench type. These load into the DOCUMENT, and a card that lifts
         off the page is rasterized from a parked subtree of that same
         document — so the faces have to be resident before the first
         capture or the texture bakes a fallback. A stylesheet in <head>
         blocks first paint, which is the gate we want; the lab's first grab
         is thousands of frames later. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Archivo+Narrow:wght@500;600;700&family=Martian+Mono:wght@400;500;700&display=block"
      rel="stylesheet"
    />
