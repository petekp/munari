name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:origin-trial
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # Browser gates are sequential on purpose. Each launches a real Chrome;
  # parallel jobs exhausted the hosted runner and closed targets mid-probe.
  # Every focused law and the broad consumer walk still runs on every push.
  browser-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:frame-surface
      - run: npm run gate:idle-zero
      - run: npm run gate:genie-film-reorder
      - run: npm run gate:dom-surface-demand
      - run: npm run gate:shaders
      - run: npm run gate:surface-dom
      - run: npm run gate:surface-canvas
      - run: npm run gate:surface-twin

  # The resize sweep gets a fresh runner after the focused gates. The broad
  # all-scene walk remains a local acceptance command: hosted Chrome closes
  # after loading all nine GPU-heavy scenes, even when each uses a fresh page.
  knobs-resize:
    needs: browser-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:knobs-resize
