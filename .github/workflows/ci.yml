name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:origin-trial
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - run: npm test

  # A published canvas frame is not handed off until the public Surface has
  # uploaded and drawn those exact sRGB pixels. This uses ordinary WebGL and
  # does not depend on the HTML-in-canvas origin trial.
  frame-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:frame-surface

  # The idle-zero browser gate: mounted quiescent Surfaces cost
  # 0 paints/s. drawElementImage is an origin-trial API; where the
  # runner's Chrome lacks it the gate warns and exits 0 — a loud
  # annotation, not a red build, for an environmental gap. Everywhere
  # capability exists, a nonzero idle delta is a real failure.
  idle-zero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:idle-zero

  genie-film-reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:genie-film-reorder

  dom-surface-demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:dom-surface-demand

  # The shader-compile browser gate: a shader is a string until a
  # browser makes a program of it, so nothing else in CI can tell a
  # working one from a broken one. Cheapest gate here, and the one the
  # rest assume — a shader that never compiles surfaces in the others
  # as a timeout, if it surfaces at all.
  shaders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:shaders

  # Interaction acceptance: keyboard, focus, and the three pointer modes.
  # A Surface shows one of two copies of its content at a time, so every
  # keystroke and pointer goes through a redirection that only a real
  # browser's focus and hit testing can exercise. Same capability policy as
  # the other origin-trial gates — a runner without the API warns and exits
  # 0; a capable runner that misroutes an event fails.
  surface-dom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:surface-dom

  # Several Surfaces sharing one Canvas: forward, reverse, a reversal
  # arriving mid-crossing, source replacement, context loss, and teardown.
  # It reads the handoff's own event order, because the faults it exists
  # for read as a one-frame flicker in a screenshot.
  surface-canvas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:surface-canvas

  # A Twin keeps its page copy reachable while its WebGL copy presents.
  # The only visible symptom of a Twin that released the page copy is a
  # screen reader losing the content, so nothing cheaper catches it.
  surface-twin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:surface-twin

  # The lab is a public consumer of the package. This catches broken input
  # wiring, focus handoff, interactive scene state, and visual custody that
  # unit suites cannot exercise through a real browser.
  lab-interactions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:lab-interactions

  knobs-resize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run gate:knobs-resize
